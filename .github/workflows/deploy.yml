name: Deploy to Sealos

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/1040782763-dev/dsm-autoparts:latest

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Write Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.SEALOS_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Sealos
        run: kubectl apply -f k8s/deployment.yaml

      - name: Wait for deployment
        run: kubectl rollout status deployment/dsm-autoparts --timeout=120s

      - name: Get access URL
        run: |
          echo "=== Deployment Status ==="
          kubectl get pods -l app=dsm-autoparts
          echo ""
          echo "=== Service ==="
          kubectl get svc dsm-autoparts
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress dsm-autoparts
          echo ""
          INGRESS_IP=$(kubectl get ingress dsm-autoparts -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          INGRESS_HOST=$(kubectl get ingress dsm-autoparts -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          if [ -n "$INGRESS_HOST" ]; then
            echo "App URL: https://$INGRESS_HOST"
          elif [ -n "$INGRESS_IP" ]; then
            echo "App URL: http://$INGRESS_IP"
          else
            echo "Check Sealos dashboard for the assigned URL"
          fi
